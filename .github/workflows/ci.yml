name: Windows checks and release build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
      - name: Select dependency cache
        id: dependencies
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          INPUT_HASH: ${{ hashFiles('build/dependencies.lock.json', 'build/ffmpeg.ps1', 'build/ffmpeg.sh', 'build/libass.ps1', 'build/libass-options.json', 'build/danmaku-factory.ps1', 'build/raw-compression.ps1', 'build/dependency-cache.ps1', '.gitmodules', 'third_party/DanmakuFactory/src/**', 'third_party/DanmakuFactory/LICENSE', 'third_party/DanmakuFactory/xmake.lua') }}
        run: |
          $gcc = & "$env:MSYS2_LOCATION\mingw64\bin\gcc.exe" -dumpfullversion
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the dependency compiler.' }
          "key=windows-2025-x64-gcc-$gcc-$env:INPUT_HASH" >> $env:GITHUB_OUTPUT
      - name: Restore external dependency cache
        if: env.FULL_BUILD != 'true'
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .local/ci-dependencies
          key: ${{ steps.dependencies.outputs.key }}
          restore-keys: ${{ steps.dependencies.outputs.key }}-
      - name: Verify and extract FFmpeg source
        if: env.FULL_BUILD == 'true' || steps.cache.outputs.cache-matched-key == ''
        run: ./build/ffmpeg.ps1 -PrepareOnly
      - name: Build LGPL-only FFmpeg shared libraries
        if: env.FULL_BUILD == 'true' || steps.cache.outputs.cache-matched-key == ''
        shell: msys2 {0}
        run: |
          cd .local/dependencies/ffmpeg-8.0.1
          bash ../../../build/ffmpeg.sh
      - name: Build external libraries on cache miss or full build
        if: env.FULL_BUILD == 'true' || steps.cache.outputs.cache-matched-key == ''
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\mingw64\bin;" + $env:PATH
          ./build/ffmpeg.ps1 -CollectOnly
          ./build/libass.ps1 -Rebuild
          ./build/danmaku-factory.ps1 -Rebuild -DependenciesOnly
          ./build/raw-compression.ps1 -Rebuild -DependenciesOnly
          ./build/dependency-cache.ps1 -Mode Export
      # Save immediately, so a later project compile/test failure keeps the dependencies.
      - name: Save freshly built external dependencies
        if: env.FULL_BUILD == 'true' || steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: .local/ci-dependencies
          key: ${{ steps.dependencies.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore verified dependency files
        run: ./build/dependency-cache.ps1 -Mode Restore
      - name: Compile project native modules and managed DLLs; run checks
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\mingw64\bin;" + $env:PATH
          ./build/native.ps1
          ./build/managed.ps1 -Test
          ./build/skin.ps1
      - name: Prepare test payload
        if: env.FULL_BUILD != 'true'
        run: ./build/package.ps1 -SkipBuild -NoInstaller
      - name: Build Windows installer for manual or tag runs
        if: env.FULL_BUILD == 'true'
        run: ./build/package.ps1 -SkipBuild
      - name: Verify installation, upgrades and removal
        shell: powershell
        run: |
          ./scripts/check-package.ps1
          ./scripts/test-installation.ps1
      - name: Export installer artifacts for local act
        if: env.FULL_BUILD == 'true' && env.ACT == 'true'
        run: ./scripts/export-ci-artifacts.ps1 -Destination $env:ACT_ARTIFACT_DIR
      - name: Upload installer and checksum manifest
        if: env.FULL_BUILD == 'true' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: BilibiliBehaviors-win-x64
          path: |
            build/out/dist/*-setup.exe
            build/out/dist/*.sha256
            build/out/package/checksums.json
          if-no-files-found: error
          retention-days: 14
